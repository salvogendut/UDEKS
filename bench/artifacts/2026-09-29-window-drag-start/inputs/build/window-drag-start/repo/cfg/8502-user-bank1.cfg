# Persistent bank-1 8502 task. $E2E2-$E2FF is its saved cc65 zero page and
# $E300-$EFF0 is its bounded software-stack range.

MEMORY {
    ZP:  start = $0002, size = $001E, type = rw, file = "";
    APP: start = $9000, size = $5200, type = rw, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp, optional = yes;
    STARTUP:  load = APP, type = ro;
    LOWCODE:  load = APP, type = ro, optional = yes;
    ONCE:     load = APP, type = ro, optional = yes;
    CODE:     load = APP, type = ro;
    RODATA:   load = APP, type = ro, optional = yes;
    DATA:     load = APP, type = rw, optional = yes;
    BSS:      load = APP, type = bss, optional = yes, define = yes;
}
