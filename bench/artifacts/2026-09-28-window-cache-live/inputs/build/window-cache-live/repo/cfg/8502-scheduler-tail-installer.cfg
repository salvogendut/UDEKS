# One-shot common-RAM installer. The scheduler entry replaces this image with
# the permanent task gate before entering the kernel.

MEMORY {
    INSTALL: start = $FF05, size = $00C0, type = rw, file = %O, fill = yes;
}

SEGMENTS {
    CODE: load = INSTALL, type = rw;
}
