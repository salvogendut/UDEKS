# One-shot hardware-discovery service copied into application slot 1 during
# bootstrap. The generated bridge supplies its private resident imports.

MEMORY {
    APP: start = $0200, size = $0A00, type = rw, file = %O;
}

SEGMENTS {
    CODE:   load = APP, type = ro, define = yes;
    RODATA: load = APP, type = ro, optional = yes;
    DATA:   load = APP, type = rw, optional = yes;
    BSS:    load = APP, type = bss, optional = yes, define = yes;
}
