# Boot-only console composer. It occupies the upper part of application slot 2
# while the scheduler gather uses $1200-$15FF, and is dead after service start.

MEMORY {
    APP: start = $1600, size = $0600, type = rw, file = %O;
}

SEGMENTS {
    CODE:   load = APP, type = ro, define = yes;
    RODATA: load = APP, type = ro, optional = yes, define = yes;
    DATA:   load = APP, type = rw, optional = yes;
    BSS:    load = APP, type = bss, optional = yes, define = yes;
}
