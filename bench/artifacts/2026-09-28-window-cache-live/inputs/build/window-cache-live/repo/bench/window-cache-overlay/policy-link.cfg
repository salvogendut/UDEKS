# Measurement-only module link: no resident output, startup or execution gate.
# A possible private stack/header at $4D00+ is NOT frozen by this link.
MEMORY {
    ZP: start = $0006, size = $001A, file = "";
    MODULE: start = $4200, size = $0B00, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    OVERLAY: load = MODULE, type = rw;
    CODE: load = MODULE, type = ro;
    RODATA: load = MODULE, type = ro, optional = yes;
    DATA: load = MODULE, type = rw, optional = yes;
    BSS: load = MODULE, type = bss, optional = yes, define = yes;
}
