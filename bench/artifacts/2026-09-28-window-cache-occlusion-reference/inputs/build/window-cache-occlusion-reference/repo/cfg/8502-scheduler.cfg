# Scheduler segment delivered into the reserved $1C00-$1FFF page. The output
# is only the emitted image; the boot delivery zero-fills the rest.

MEMORY {
    SCHED: start = $1C00, size = $0400, type = ro, file = %O;
}

SEGMENTS {
    SCHEDULER: load = SCHED, type = ro;
}

# The historical standalone identity image has no lifecycle tail. Production
# uses cfg/8502-scheduler-overlay.cfg, where the real symbol overrides this
# link-local compatibility value.
SYMBOLS {
    _udeks_lifecycle_bootstrap: type = weak, value = $2000;
}
