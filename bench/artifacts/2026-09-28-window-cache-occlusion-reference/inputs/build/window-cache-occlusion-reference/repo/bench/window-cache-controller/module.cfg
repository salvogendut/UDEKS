MEMORY {
    ZP: start=$0006, size=$001A, type=rw, define=yes;
    MODULE: start=$4200, size=$1020, type=rw, file=%O;
    STATE: start=$5220, size=$0030, type=rw, file="";
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp;
    OVERLAY: load=MODULE, type=rw;
    DISPATCH: load=MODULE, type=rw;
    CODE: load=MODULE, type=rw;
    RODATA: load=MODULE, type=ro;
    DATA: load=MODULE, type=rw, optional=yes;
    PRIVATESTATE: load=STATE, type=bss, define=yes;
    BSS: load=STATE, type=bss, optional=yes;
}
