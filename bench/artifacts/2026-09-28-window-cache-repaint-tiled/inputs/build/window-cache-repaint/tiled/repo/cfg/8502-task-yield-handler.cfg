# Post-bootstrap lifecycle request handler. The scheduler overlay installs it
# in the permanent bank-0 tail, outside both loader-managed application slots.

MEMORY {
    HANDLER: start = $C900, size = $04BD, type = ro, file = %O;
}

SEGMENTS {
    YIELDHANDLER: load = HANDLER, type = ro, define = yes;
}
