# Runs from the dead tail of the native boot-sector page. probe.o replaces the
# complete page after this installer has copied the boot console to $1600.

MEMORY {
    INSTALL: start = $0B40, size = $00C0, type = ro, file = %O;
}

SEGMENTS {
    CODE: load = INSTALL, type = ro;
}
