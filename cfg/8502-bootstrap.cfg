# Resident bank-0 kernel image. I/O occupies $D000-$DFFF and the top 4 KiB is
# common RAM, so the ordinary linked image must stop before $D000.

MEMORY {
    ZP:     start = $0002, size = $001F, type = rw, file = "";
    APP1:   start = $0200, size = $0A00, type = rw,
            file = "build/8502/udeks-app1.bin", fill = yes;
    LOWMEM: start = $0C00, size = $0600, type = rw, file = "";
    APP2:   start = $1200, size = $0A00, type = rw,
            file = "build/8502/udeks-app2.bin", fill = yes;
    KERNEL: start = $2000, size = $B000, type = rw, file = %O, fill = yes;
    HIGHMEM: start = $E1B8, size = $012A, type = rw, file = "";
    TASKREQUEST: start = $F800, size = $0200, type = rw,
                 file = "build/boot/task-request-gateway.bin", fill = yes;
    TASKGATE: start = $FF05, size = $00CB, type = rw,
              file = "build/boot/task-bank-gateway.bin", fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp,  optional = yes;
    APP1CODE: load = APP1,   type = ro,  optional = yes;
    APP1RODATA: load = APP1, type = ro,  optional = yes;
    APP1BSS:  load = APP1,   type = bss, optional = yes, define = yes;
    LOWBSS:   load = LOWMEM, type = bss, optional = yes, define = yes;
    APP2CODE: load = APP2,   type = ro,  optional = yes;
    APP2RODATA: load = APP2, type = ro,  optional = yes;
    APP2BSS:  load = APP2,   type = bss, optional = yes, define = yes;
    STARTUP:  load = KERNEL, type = ro;
    LOWCODE:  load = KERNEL, type = ro,  optional = yes;
    ONCE:     load = KERNEL, type = ro,  optional = yes;
    CODE:     load = KERNEL, type = ro;
    RODATA:   load = KERNEL, type = ro,  optional = yes;
    DATA:     load = KERNEL, type = rw,  optional = yes;
    BSS:      load = KERNEL, type = bss, optional = yes, define = yes;
    HIGHBSS:  load = HIGHMEM, type = bss, optional = yes, define = yes;
    TASKREQUEST: load = TASKREQUEST, type = rw;
    VICSHADOW: load = KERNEL, type = bss, optional = yes, define = yes,
               align = $100;
    SYSCALLS: load = KERNEL, type = ro, start = $CF00;
    TASKGATE: load = TASKGATE, type = rw;
}
