# Dedicated post-startup slot in the normal kernel layout. Only the checked
# svc loader may install this image after startup has retired. Older kernels
# without UTRQ 0.19 support have live resident data here; never raw-load it.
MEMORY {
    IMAGE: start=$93D0, size=$02D8, type=rw, file=%O, define=yes;
}
SEGMENTS {
    HEADER: load=IMAGE, type=ro;
    CODE: load=IMAGE, type=ro;
    RODATA: load=IMAGE, type=ro, optional=yes;
    DATA: load=IMAGE, type=rw, optional=yes;
    BSS: load=IMAGE, type=bss, define=yes;
}
