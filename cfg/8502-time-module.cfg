# Candidate only: normal boot has not reserved or installed this region yet.
# This address overlaps the BASELINE resident; it is link/test-only until a
# replacement map proves all live resident state below $93D0. Never raw-load
# the candidate into a running normal kernel.
MEMORY {
    IMAGE: start=$93D0, size=$02D8, type=rw, file=%O, define=yes;
}
SEGMENTS {
    HEADER: load=IMAGE, type=ro;
    CODE: load=IMAGE, type=ro;
    RODATA: load=IMAGE, type=ro, optional=yes;
    DATA: load=IMAGE, type=rw, optional=yes;
    BSS: load=IMAGE, type=bss, define=yes;
}
