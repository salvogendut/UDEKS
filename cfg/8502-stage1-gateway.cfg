MEMORY {
    COMMON: start = $F700, size = $0300, type = rw, file = %O;
    TASK:   start = $FA00, size = $0500, type = rw,
            file = "build/boot/task-loader.bin";
}

SEGMENTS {
    CODE: load = COMMON, type = rw;
    TASKLOADER: load = TASK, type = rw;
}
