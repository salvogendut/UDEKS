MEMORY {
    FINAL:  start = $F700, size = $0100, type = rw, file = %O, fill = yes;
    COMMON: start = $F800, size = $0200, type = rw, file = %O;
    TASK:   start = $F910, size = $05F0, type = rw,
            file = "build/boot/task-loader.bin";
    LOOKUP: start = $1A00, size = $0500, type = rw,
            file = "build/boot/task-lookup.bin";
}

SEGMENTS {
    FINAL: load = FINAL, type = rw;
    SCHEDINSTALL: load = FINAL, type = rw, start = $F7D8;
    CODE: load = COMMON, type = rw;
    TASKLOADER: load = TASK, type = rw;
    BOOTINIT: load = TASK, type = rw, start = $FE80;
    TASKLOOKUP: load = LOOKUP, type = rw;
}
