MEMORY {
    MODULE: start = $D900, size = $0700, type = rw, file = %O;
    RELOC: start = $1880, size = $0180, type = rw, file = "build/boot/banked-reloc.bin";
    ACCESS: start = $1F00, size = $0100, type = rw, file = "build/boot/banked-access.bin";
}
SEGMENTS {
    CODE: load = MODULE, type = rw;
    RELOC: load = RELOC, type = rw;
    ACCESS: load = ACCESS, type = rw;
}
