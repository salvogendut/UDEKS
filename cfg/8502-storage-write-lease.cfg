# Experimental callable service, NOT yet installed by normal boot images.
MEMORY {
    ZP: start=$0002, size=$001E, type=rw, file="";
    MODULE: start=$1200, size=$0680, type=rw, file=%O;
    POLICY: start=$B000, size=$1600, type=rw, file="build/storage-write-lease/policy.bin";
    STATE: start=$E000, size=$0180, type=rw, file="";
    DRIVER: start=$E300, size=$0600, type=rw, file="build/storage-write-lease/driver.bin";
    HIDDEN: start=$F000, size=$0F00, type=rw, file="build/storage-write-lease/hidden.bin";
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp;
    STARTUP: load=MODULE, type=ro;
    CODE: load=MODULE, type=ro;
    RODATA: load=HIDDEN, type=ro;
    DATA: load=MODULE, type=rw, optional=yes;
    BSS: load=STATE, type=bss, define=yes;
    IECCODE: load=DRIVER, type=rw;
    STORAGECODE: load=POLICY, type=ro;
    STORAGEHIGH: load=HIDDEN, type=ro;
}
