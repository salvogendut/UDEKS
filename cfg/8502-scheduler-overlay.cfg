# Link-only qualification layout for Tasking 0.1. The first output proves the
# bounded scheduler page; the second proves that policy, lifecycle state, and
# BSS fit the reclaimed post-shadow tail. It is not installed by stage 1 yet.

MEMORY {
    PAGE: start = $1C00, size = $0400, type = ro, file = %O, fill = yes;
    TAIL: start = $C120, size = $0DE0, type = rw,
          file = "build/8502/udeks-scheduler-overlay-tail.bin";
}

SEGMENTS {
    SCHEDULER: load = PAGE, type = ro, define = yes;
    CODE:      load = TAIL, type = ro, define = yes;
    RODATA:    load = TAIL, type = ro, optional = yes, define = yes;
    DATA:      load = TAIL, type = rw, optional = yes, define = yes;
    BSS:       load = TAIL, type = bss, optional = yes, define = yes;
}
