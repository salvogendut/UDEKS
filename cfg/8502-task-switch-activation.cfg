# The 62 bytes after the boot-console composer are the last contiguous bytes
# below the scheduler scatter manifest.  The common body runs from the
# disposable VIC gateway workspace while changing the MMU mapping.

MEMORY {
    APP:    start = $1BAA, size = $003E, type = ro, file = %O;
    COMMON: start = $F68A, size = $003E, type = rw, file = "";
}

SEGMENTS {
    ACTCOMMON:  load = APP, run = COMMON, type = rw, define = yes;
}
