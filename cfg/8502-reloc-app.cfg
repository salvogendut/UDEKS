# Canonical link address, NOT a slot selection. The packer uses ld65's o65
# records to produce a page-relocatable UDEX image; private ZP stays at $02.
MEMORY {
    ZP: start = $0002, size = $001E, type = rw;
    APP: start = $1000, size = $3000, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    STARTUP: load = APP, type = ro;
    CODE: load = APP, type = ro;
    RODATA: load = APP, type = ro, optional = yes;
    DATA: load = APP, type = rw, optional = yes;
    BSS: load = APP, type = bss, define = yes;
}
FILES { %O: format = o65; }
FORMATS { o65: os = cc65, type = small; }
