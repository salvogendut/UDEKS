# Resident bank-0 kernel image. I/O occupies $D000-$DFFF and the top 4 KiB is
# common RAM, so the ordinary linked image must stop before $D000.

MEMORY {
    # $02-$03 stay reserved: the UAPP 0.1 zero-page ABI fixes none.lib's
    # runtime layout at $06-$1F, so the linked region starts above them.
    ZP:     start = $0004, size = $001D, type = rw, file = "";
    LOWMEM: start = $9B00, size = $0600, type = rw, file = "";
    PATHS: start = $96B8, size = $03F0, type = ro,
           file = "build/8502/retained-paths-panic.bin", fill = yes;
    GRAPHICS: start = $0C00, size = $0600, type = ro,
              file = "build/8502/banked-graphics-panic.bin", fill = yes;
    BOOTCRT: start = $1C00, size = $0100, type = ro,
             file = "build/boot/8502-crt0-panic-probe.bin", fill = yes;
    BOOTPROBE: start = $0B00, size = $0100, type = ro,
               file = "build/boot/8502-probe-panic-probe.bin", fill = yes;
    KERNEL: start = $2000, size = $B000, type = rw, file = %O, fill = yes;
    MODULE: start = $E300, size = $0344, type = rw,
            file = "build/8502/udeks-module.bin";
    HIGHMEM: start = $E1B8, size = $012A, type = rw, file = "";
    BOOTFSREQUEST: start = $F3EF, size = $029B, type = rw,
                 file = "build/boot/bootfs-request-service.bin", fill = yes;
    TASKREQUEST: start = $F800, size = $0109, type = rw,
                 file = "build/boot/task-request-gateway.bin", fill = yes;
    TASKGATE: start = $FF05, size = $00C0, type = rw,
              file = "build/boot/task-bank-gateway.bin", fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp,  optional = yes;
    LOWBSS:   load = LOWMEM, type = bss, optional = yes, define = yes;
    GRAPHICSCODE: load = GRAPHICS, type = ro;
    STARTUP:  load = BOOTCRT, type = ro;
    PROBECODE: load = BOOTPROBE, type = ro;
    KERNELENTRY: load = KERNEL, type = ro, start = $2000;
    LOWCODE:  load = KERNEL, type = ro,  optional = yes;
    ONCE:     load = KERNEL, type = ro,  optional = yes;
    CODE:     load = KERNEL, type = ro;
    RODATA:   load = KERNEL, type = ro,  optional = yes;
    DATA:     load = KERNEL, type = rw,  optional = yes;
    BSS:      load = KERNEL, type = bss, optional = yes, define = yes;
    VDCASSETS: load = KERNEL, type = ro, start = $96A8, define = yes;
    PATHSTATE: load = PATHS, type = ro;
    GRAPHICSPATHS: load = PATHS, type = ro;
    HIGHBSS:  load = HIGHMEM, type = bss, optional = yes, define = yes;
    MODULECODE: load = MODULE, type = ro, optional = yes;
    MODULERODATA: load = MODULE, type = ro, optional = yes;
    BOOTFSCODE: load = BOOTFSREQUEST, type = ro;
    TASKREQUEST: load = TASKREQUEST, type = rw;
    GRAPHICSHELP: load = KERNEL, type = ro, start = $A100;
    VICSHADOW: load = KERNEL, type = bss, start = $A1E0, optional = yes, define = yes;
    SYSCALLS: load = KERNEL, type = ro, start = $CF00;
    TASKGATE: load = TASKGATE, type = rw;
}
