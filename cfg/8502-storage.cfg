# Private bank-1 context; ush owns $9000-$9FFF and stack $E900-$EFF0.
MEMORY {
    ZP: start=$0002, size=$001E, type=rw, file="";
    MODULE: start=$1200, size=$0800, type=rw, file=%O;
    POLICY: start=$8A00, size=$0600, type=rw, file="build/storage/policy.bin";
    STATE: start=$E000, size=$0100, type=rw, file="";
    DRIVER: start=$E300, size=$0600, type=rw, file="build/storage/driver.bin";
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp;
    STARTUP: load=MODULE, type=ro;
    CODE: load=MODULE, type=ro;
    RODATA: load=MODULE, type=ro;
    DATA: load=MODULE, type=rw;
    BSS: load=STATE, type=bss, define=yes;
    IECCODE: load=DRIVER, type=ro;
    STORAGECODE: load=POLICY, type=ro;
}
