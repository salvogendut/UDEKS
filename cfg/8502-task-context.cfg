# Non-installed production binding proof. The active lifecycle overlay ends at
# $CDC2 and leaves this exact post-overlay window; its scheduler page leaves
# the final six bytes for the fixed callback vectors.

MEMORY {
    CONTEXT: start = $CDC3, size = $013D, type = rw, file = %O;
    VECTORS: start = $1FFA, size = $0006, type = ro,
             file = "build/8502/task-context-vectors.bin";
}

SEGMENTS {
    CODE:      load = CONTEXT, type = ro, define = yes;
    RODATA:    load = CONTEXT, type = ro, optional = yes, define = yes;
    DATA:      load = CONTEXT, type = rw, optional = yes, define = yes;
    BSS:       load = CONTEXT, type = bss, define = yes;
    SCHEDULER: load = VECTORS, type = ro;
}
