# Post-bootstrap lifecycle request handler. The boot/probe page is dead after
# service startup and provides a bounded resident home outside app slots.

MEMORY {
    HANDLER: start = $0B00, size = $0100, type = ro, file = %O;
}

SEGMENTS {
    YIELDHANDLER: load = HANDLER, type = ro, define = yes;
}
