# Post-bootstrap scheduler-page overlay. It may replace the retired $1C00
# bootstrap prefix but must leave the fixed context vectors at $1FFA intact.

MEMORY {
    HANDLER: start = $1C00, size = $03FA, type = ro, file = %O;
}

SEGMENTS {
    YIELDHANDLER: load = HANDLER, type = ro, define = yes;
}
