# LINK MEASUREMENT ONLY. Not a bootable storage service: public request and
# lifecycle hooks still need private snapshots while common RAM is disabled.
MEMORY {
    ZP: start=$0002, size=$001E, type=rw, file="";
    MODULE: start=$1200, size=$0680, type=rw, file=%O;
    POLICY: start=$B000, size=$1600, type=rw, file="build/storage-write-placement/policy.bin";
    STATE: start=$E000, size=$0180, type=rw, file="";
    DRIVER: start=$E300, size=$0600, type=rw, file="build/storage-write-placement/driver.bin";
    # Physical bank 1 only. Never visible while the normal top-common bit is on.
    # Exclude the entire $FF00 page (MMU mirrors, mirrored NMI stub/vectors).
    HIDDEN: start=$F000, size=$0F00, type=rw, file="build/storage-write-placement/hidden.bin";
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp;
    STARTUP: load=MODULE, type=ro;
    CODE: load=MODULE, type=ro;
    RODATA: load=HIDDEN, type=ro;
    DATA: load=MODULE, type=rw;
    BSS: load=STATE, type=bss, define=yes;
    IECCODE: load=DRIVER, type=ro;
    STORAGECODE: load=POLICY, type=ro;
    STORAGEHIGH: load=HIDDEN, type=ro;
}
