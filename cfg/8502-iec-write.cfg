MEMORY {
    ZP: start = $0002, size = $001A, type = rw, file = "";
    MAIN: start = $2800, size = $3800, type = rw, file = %O;
    STATE: start = $6100, size = $0400, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP: load = MAIN, type = ro;
    CODE: load = MAIN, type = ro;
    STORAGECODE: load = MAIN, type = ro;
    IECCODE: load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA: load = MAIN, type = rw;
    BSS: load = STATE, type = bss, define = yes;
}
